name: "breast_cancer"
display_name: "Wisconsin Diagnostic Breast Cancer (WDBC)"
data_path: "data/processed/breast_cancer_clean.parquet"
weights_path: "configs/weights/breast_cancer_weights.json"
provenance_path: "configs/weights/provenance.csv"

target: "diagnosis"
seed: 42

top_k: [5, 10, 15, 20]

features:
  - mean_radius
  - mean_texture
  - mean_perimeter
  - mean_area
  - mean_smoothness
  - mean_compactness
  - mean_concavity
  - mean_concave_points
  - mean_symmetry
  - mean_fractal_dimension
  - radius_error
  - texture_error
  - perimeter_error
  - area_error
  - smoothness_error
  - compactness_error
  - concavity_error
  - concave_points_error
  - symmetry_error
  - fractal_dimension_error
  - worst_radius
  - worst_texture
  - worst_perimeter
  - worst_area
  - worst_smoothness
  - worst_compactness
  - worst_concavity
  - worst_concave_points
  - worst_symmetry
  - worst_fractal_dimension
